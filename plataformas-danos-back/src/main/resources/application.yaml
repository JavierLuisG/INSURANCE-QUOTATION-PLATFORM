spring:
  application:
    name: plataformas-danos-back
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:plataformas_danos}
      username: ${MONGODB_USERNAME:admin}
      password: ${MONGODB_PASSWORD:admin}
      authentication-database: ${MONGODB_AUTH_DATABASE:admin}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=3600s

server:
  port: ${PORT:8080}

logging:
  pattern:
    console: '{"timestamp":"%d","level":"%p","correlation-id":"%X{correlationId}","logger":"%logger","message":"%m"}%n'
  level:
    root: INFO
    com.plataformas_danos_back: DEBUG

jwt:
  secret: ${JWT_SECRET:changeme-use-env-var-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

plataforma-core-ohs:
  url: ${PLATAFORMA_CORE_OHS_URL:http://localhost:3001}
  timeout-ms: ${PLATAFORMA_CORE_OHS_TIMEOUT_MS:5000}

validation:
  inconsistency-threshold-percent: ${VALIDATION_INCONSISTENCY_THRESHOLD_PERCENT:10}

resilience4j:
  circuitbreaker:
    instances:
      plataforma-core-ohs:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      plataforma-core-ohs:
        max-attempts: 3
        wait-duration: 1000ms
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
